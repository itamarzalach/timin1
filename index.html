<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>החידון של איתמר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fffaf6;
    --ink: #4a3228;
    --line: #f1ddd2;
    --margin: #e9a9a9;
    --yellow: #f6e1cf;
    --pink: #fbd7dc;
    --mint: #fff1e4;
    --sky: #f2d5c4;
    --orange: #f9dfe0;
    --good: #7a8f5a;
    --bad: #b5524f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Rubik", "Arial Hebrew", Arial, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(to left, transparent 46px, var(--margin) 46px, var(--margin) 48px, transparent 48px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--line) 31px, var(--line) 33px);
    background-attachment: local;
    position: relative;
  }
  /* spiral holes */
  body::before {
    content: "";
    position: fixed; top: 0; bottom: 0; right: 10px; width: 16px;
    background: radial-gradient(circle at center, #e6d5c8 0 6px, #cdb8a8 6px 7px, transparent 7px) 0 0 / 16px 44px repeat-y;
    pointer-events: none; opacity: .8;
  }
  main {
    width: 100%; max-width: 520px; margin: 0 auto;
    padding: 20px 16px 40px 16px; padding-right: 60px;
    position: relative; z-index: 1;
  }
  @media (min-width: 560px) { main { padding-right: 16px; } body::before { display:none; } }

  h1 { margin: 6px 0 4px; font-size: 1.7rem; font-weight: 800; text-align: center; }
  .sub { text-align: center; margin: 0 0 14px; font-size: 1rem; opacity: .8; }

  /* progress */
  .progress { display: flex; gap: 8px; justify-content: center; margin-bottom: 6px; }
  .dot {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700;
    background: #fff; border: 2px dashed #c9a28f; color: #9a7b69;
    transition: all .3s;
  }
  .dot.done { background: var(--good); border: 2px solid var(--good); color: #fff; }
  .dot.now { background: var(--yellow); border: 2px solid var(--ink); color: var(--ink); transform: scale(1.12); }
  .count { text-align: center; font-weight: 500; margin: 0 0 18px; }

  /* note */
  .note {
    position: relative;
    background: var(--yellow);
    padding: 40px 20px 24px;
    margin-top: 16px;
    border-radius: 4px;
    box-shadow: 0 8px 18px rgba(90,55,35,.18), 0 1px 2px rgba(0,0,0,.12);
    transform: rotate(-1deg);
    animation: pop .45s ease both;
    /* folded corner (bottom-left) */
    clip-path: polygon(0 0, 100% 0, 100% 100%, 34px 100%, 0 calc(100% - 34px));
  }
  .note.c1 { background: var(--yellow); }
  .note.c2 { background: var(--pink); transform: rotate(.8deg); }
  .note.c3 { background: var(--mint); transform: rotate(-.6deg); }
  .note.c4 { background: var(--sky); transform: rotate(1deg); }
  .note.c5 { background: var(--orange); transform: rotate(-.8deg); }
  .fold {
    position: absolute; left: 0; bottom: 0; width: 34px; height: 34px;
    background: linear-gradient(45deg, rgba(0,0,0,.18) 50%, rgba(255,255,255,.7) 50%);
    border-top-right-radius: 6px;
    z-index: 2;
  }
  .wrap { position: relative; }
  .tape {
    position: absolute; top: -6px; left: 50%; width: 110px; height: 30px;
    margin-left: -55px; transform: rotate(-3deg);
    background: rgba(255,255,255,.6);
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 6px, rgba(0,0,0,.04) 6px 12px);
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    z-index: 3;
  }
  .pin {
    position: absolute; top: -10px; left: 50%; margin-left: -13px;
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9a9a, #d6455d 60%, #8e2236);
    box-shadow: 0 3px 4px rgba(0,0,0,.35); z-index: 3;
  }
  .q { font-size: 1.55rem; line-height: 1.35; font-weight: 800; margin: 0 0 20px; text-align: center; }
  .answers { display: grid; gap: 12px; }
  .ans {
    font: inherit; font-size: 1.25rem; font-weight: 700; color: var(--ink);
    min-height: 60px; width: 100%; padding: 12px 16px;
    background: #fff; border: 2px solid #c9a28f; border-radius: 14px;
    box-shadow: 0 4px 0 #c9a28f;
    cursor: pointer; touch-action: manipulation;
    transition: transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .08s, background .2s;
  }
  .ans:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .ans:focus-visible { outline: 4px solid #6a4cff; outline-offset: 3px; }
  .ans.right { background: #e4ecd3; border-color: var(--good); box-shadow: 0 4px 0 var(--good); animation: hop .6s; }
  .ans.wrong { background: #f8dcd9; border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); animation: dodge .7s both; }
  .answers.locked .ans { pointer-events: none; }
  .msg { min-height: 34px; margin: 16px 0 0; text-align: center; font-size: 1.2rem; font-weight: 700; color: var(--bad); }
  .msg.ok { color: var(--good); }

  /* final */
  .final { text-align: center; padding-top: 52px; }
  .final p { font-size: 1.5rem; line-height: 1.5; font-weight: 800; margin: 0; }
  .final small { display:block; margin-top: 12px; font-size: 1.05rem; font-weight: 500; }
  .deco { font-size: 2.6rem; letter-spacing: 6px; margin-bottom: 8px; }
  .contact { margin-top: 18px; font-size: 1.15rem; font-weight: 500; }
  .scene { display:flex; justify-content:center; gap:10px; font-size:2.2rem; margin-top:12px; }
  .sun { position:absolute; top:-26px; left:-10px; font-size:3rem; z-index:4; animation: spin 20s linear infinite; }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .confetti i {
    position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px;
    animation: fall linear forwards;
  }

  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96) rotate(-3deg); } }
  @keyframes hop { 0%{transform:translateY(0)} 30%{transform:translateY(-14px) scale(1.04)} 60%{transform:translateY(0)} 80%{transform:translateY(-5px)} 100%{transform:translateY(0)} }
  @keyframes dodge { 0%{transform:translateX(0)} 25%{transform:translateX(-46px) rotate(-5deg)} 50%{transform:translateX(38px) rotate(4deg)} 75%{transform:translateX(-22px) rotate(-2deg)} 100%{transform:translateX(0)} }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-12px); }
    40% { transform: translateX(10px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(5px); }
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>החידון הגדול 📝</h1>
  <p class="sub">חמש שאלות קטנות, פרס אחד גדול</p>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="stage"><noscript><p class="msg">כדי לראות את החידון צריך לפתוח את הקובץ בדפדפן רגיל (כרום או ספארי), לא בתצוגה מקדימה.</p></noscript></div>
</main>

<script>
const QUESTIONS = [
  { q: "מי הילד האהוב?",
    a: [ {t:"אורי", ok:false, m:"תנסו שוב"}, {t:"אלה", ok:false, m:"תנסו שוב"}, {t:"איתמר", ok:true} ] },
  { q: "אתם אוהבים חופשות?",
    a: [ {t:"כן", ok:true}, {t:"לא", ok:false, m:"תנסו שוב"} ] },
  { q: "מי הכי מצחיק במשפחה?",
    a: [ {t:"איתמר", ok:true}, {t:"איתמר", ok:true}, {t:"איתמר", ok:true} ] },
  { q: "האם אתם פנויים בין התאריכים 14–16 בפברואר?",
    a: [ {t:"כן", ok:true}, {t:"לא", ok:false, m:"מזל שאני לא שואל אתכם"} ] },
  { q: "האם אתם מוכנים?",
    a: [ {t:"כן", ok:true}, {t:"כמובן", ok:true}, {t:"הכל נכון", ok:true} ] }
];
const COLORS = ["c1","c2","c3","c4","c5"];
const stage = document.getElementById("stage");
const progress = document.getElementById("progress");
const count = document.getElementById("count");
let cur = 0, busy = false;

function renderProgress() {
  progress.innerHTML = "";
  QUESTIONS.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i < cur ? " done" : i === cur ? " now" : "");
    d.textContent = i < cur ? "✓" : i + 1;
    progress.appendChild(d);
  });
  count.textContent = cur < QUESTIONS.length ? `שאלה ${cur + 1} מתוך ${QUESTIONS.length}` : "סיימתם! 🎉";
}

function showQuestion() {
  renderProgress();
  busy = false;
  const item = QUESTIONS[cur];
  stage.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  wrap.innerHTML = `<div class="${cur % 2 ? "pin" : "tape"}"></div>`;
  const note = document.createElement("section");
  note.className = "note " + COLORS[cur];
  const h = document.createElement("h2");
  h.className = "q"; h.textContent = item.q;
  const list = document.createElement("div");
  list.className = "answers";
  const msg = document.createElement("p");
  msg.className = "msg"; msg.setAttribute("aria-live", "assertive");
  item.a.forEach(opt => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "ans"; b.textContent = opt.t;
    b.addEventListener("click", () => choose(b, opt, list, msg));
    list.appendChild(b);
  });
  note.append(h, list, msg);
  note.insertAdjacentHTML("beforeend", '<div class="fold"></div>');
  wrap.appendChild(note);
  stage.appendChild(wrap);
}

function choose(btn, opt, list, msg) {
  if (busy) return;
  if (!opt.ok) {
    btn.classList.remove("wrong");
    void btn.offsetWidth; // restart animation
    btn.classList.add("wrong");
    msg.className = "msg";
    msg.textContent = opt.m || "תנסו שוב";
    return;
  }
  busy = true;
  list.classList.add("locked");
  btn.classList.add("right");
  msg.className = "msg ok";
  msg.textContent = "נכון! ✨";
  setTimeout(() => {
    cur++;
    if (cur >= QUESTIONS.length) showFinal(); else showQuestion();
  }, 800);
}

function showFinal() {
  renderProgress();
  stage.innerHTML = `
    <div class="wrap">
      <div class="tape"></div>
      <div class="sun" aria-hidden="true">☀️</div>
      <section class="note c3 final">
        <div class="deco" aria-hidden="true">🌴🌊🌴</div>
        <p>כל הכבוד! עניתם נכון על כל השאלות וזכיתם בחופשה מפנקת באילת מהבן האהוב עליכם איתמר (שכואב לו בכיס)</p>
        <div class="scene" aria-hidden="true">🏖️ 🐠 ⛱️ 🌴</div>
        <p class="contact">לעוד פרטים תפנו לבן האהוב עליכם</p>
        <div class="fold"></div>
      </section>
    </div>`;
  confetti();
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div");
  box.className = "confetti";
  const cols = ["#e8b4a0","#f4c6cc","#c9a28f","#fbe3d3","#d98c7a","#a9794f"];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = (2.6 + Math.random() * 2.4) + "s";
    p.style.animationDelay = (Math.random() * 1.2) + "s";
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 7000);
}

showQuestion();
</script>
</body>
</html>
